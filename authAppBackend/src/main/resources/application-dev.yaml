server:
  port: 8083

# Database configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: "${DB_PASSWORD}"

    # Hikari Configurations
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 1800000
      leak-detection-timeout: 0
      initialization-fail-timeout: -1

  # Jpa & Hibernate Configurations
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true

# Spring Security Debug Configurations
logging:
  level:
    org.springframework.security: DEBUG